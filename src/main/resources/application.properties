spring.application.name=product-inventory-api
server.port=8080

# ---- Database (default: H2 in-memory, zero setup) ----
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT (override with env vars in real deployments) ----
jwt.secret=${JWT_SECRET:inventory-api-demo-secret-key-change-me-in-production-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- Pagination: client cannot request more than 50 rows per page ----
spring.data.web.pageable.max-page-size=50

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
